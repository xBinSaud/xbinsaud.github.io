<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وقتان</title>
  <style>
:root {
  --bg: #f6f1ea;
  --card: #fffdf9;
  --text: #1c1917;
  --muted: #57534e;
  --accent: #154143;
  --link: #0f5c5e;
  --line: #e6ddd2;
}
* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "SF Arabic", "Segoe UI", "Geeza Pro", Tahoma, system-ui, -apple-system, sans-serif;
  line-height: 1.75;
}
.wrap {
  max-width: 44rem;
  margin: 0 auto;
  padding: 1.5rem 1.15rem 3.5rem;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 1.5rem;
}
.brand {
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  font-size: 1.15rem;
}
.lang a {
  color: var(--link);
  text-decoration: none;
  font-size: 0.95rem;
}
.lang a:hover, a:hover { text-decoration: underline; }
h1 { font-size: 1.7rem; line-height: 1.35; margin: 0 0 0.4rem; color: var(--accent); }
.meta { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.75rem; }
h2 {
  font-size: 1.15rem;
  color: var(--accent);
  margin: 2rem 0 0.6rem;
  padding-top: 0.4rem;
}
p, li { margin: 0 0 0.85rem; }
ul { padding-inline-start: 1.3rem; }
a { color: var(--link); }
footer {
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.95rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1.15rem 1.2rem;
  margin: 1rem 0 1.5rem;
}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="brand">وقتان</span>
      <nav class="lang"><a href="/waqtan/privacy/en/" lang="en" dir="ltr">English</a></nav>
    </header>
    <h1>وقتان</h1>
    <p>تطبيق للشفتات والمناوبات على iPhone.</p>
    <div class="card">
      <p><a href="/waqtan/privacy/">سياسة الخصوصية</a></p>
      <p><a href="/waqtan/privacy/en/" lang="en" dir="ltr">Privacy Policy (English)</a></p>
      <p><a href="/waqtan/support/">الدعم</a> · <a href="mailto:msmscod@gmail.com">msmscod@gmail.com</a></p>
    </div>
  </div>
</body>
</html>
